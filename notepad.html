<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>메모장</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f5f0;
      --sidebar-bg: #1e1e1e;
      --sidebar-text: #ccc;
      --sidebar-hover: #2e2e2e;
      --sidebar-active: #3a3a3a;
      --sidebar-active-border: #f0c040;
      --editor-bg: #fefefe;
      --text: #222;
      --muted: #888;
      --border: #ddd;
      --header-bg: #fff;
      --btn-bg: #f0c040;
      --btn-hover: #e0b030;
      --danger: #e05050;
      --danger-hover: #c04040;
      --shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 240px;
      min-width: 200px;
      background: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      color: var(--sidebar-text);
      flex-shrink: 0;
    }

    #sidebar-header {
      padding: 18px 16px 12px;
      border-bottom: 1px solid #333;
    }

    #sidebar-header h1 {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.5px;
    }

    #sidebar-header span {
      font-size: 11px;
      color: #666;
    }

    #new-note-btn {
      margin: 12px;
      padding: 9px 12px;
      background: var(--btn-bg);
      color: #111;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      text-align: center;
    }

    #new-note-btn:hover { background: var(--btn-hover); }

    #search-box {
      margin: 0 12px 10px;
      padding: 7px 10px;
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #ccc;
      font-size: 13px;
      outline: none;
      width: calc(100% - 24px);
    }

    #search-box::placeholder { color: #555; }
    #search-box:focus { border-color: #555; }

    #note-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 0;
    }

    #note-list::-webkit-scrollbar { width: 4px; }
    #note-list::-webkit-scrollbar-track { background: transparent; }
    #note-list::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }

    .note-item {
      padding: 10px 16px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: background 0.1s;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .note-item:hover { background: var(--sidebar-hover); }

    .note-item.active {
      background: var(--sidebar-active);
      border-left-color: var(--sidebar-active-border);
    }

    .note-item-title {
      font-size: 13px;
      font-weight: 500;
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item-preview {
      font-size: 11px;
      color: #666;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .note-item-date {
      font-size: 10px;
      color: #555;
    }

    #note-count {
      padding: 10px 16px;
      font-size: 11px;
      color: #555;
      border-top: 1px solid #2a2a2a;
    }

    /* Main Editor */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #editor-header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: var(--shadow);
      flex-shrink: 0;
    }

    #note-title-input {
      flex: 1;
      font-size: 18px;
      font-weight: 600;
      border: none;
      outline: none;
      background: transparent;
      color: var(--text);
    }

    #note-title-input::placeholder { color: #bbb; }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .header-btn {
      padding: 6px 14px;
      border: none;
      border-radius: 5px;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.15s;
      font-weight: 500;
    }

    #save-btn {
      background: var(--btn-bg);
      color: #111;
    }

    #save-btn:hover { background: var(--btn-hover); }

    #delete-btn {
      background: #f5f5f5;
      color: var(--danger);
      border: 1px solid #e8e8e8;
    }

    #delete-btn:hover { background: #fee; }

    #saved-indicator {
      font-size: 12px;
      color: #aaa;
      transition: opacity 0.3s;
    }

    #toolbar {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
      padding: 6px 16px;
      display: flex;
      gap: 4px;
      align-items: center;
      flex-shrink: 0;
    }

    .toolbar-btn {
      padding: 4px 8px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      color: #555;
      transition: all 0.1s;
      min-width: 28px;
      text-align: center;
    }

    .toolbar-btn:hover {
      background: #f0f0f0;
      border-color: var(--border);
    }

    .toolbar-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 4px;
    }

    #editor-area {
      flex: 1;
      padding: 24px 32px;
      overflow-y: auto;
      background: var(--editor-bg);
    }

    #editor-area::-webkit-scrollbar { width: 6px; }
    #editor-area::-webkit-scrollbar-thumb { background: #ddd; border-radius: 3px; }

    #note-content {
      width: 100%;
      min-height: 100%;
      border: none;
      outline: none;
      resize: none;
      font-size: 15px;
      line-height: 1.75;
      color: var(--text);
      background: transparent;
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif;
    }

    #status-bar {
      background: #fafafa;
      border-top: 1px solid var(--border);
      padding: 5px 20px;
      display: flex;
      gap: 20px;
      font-size: 11px;
      color: #aaa;
      flex-shrink: 0;
    }

    #empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--editor-bg);
      color: #bbb;
      gap: 12px;
    }

    #empty-state svg {
      opacity: 0.3;
    }

    #empty-state p {
      font-size: 14px;
    }

    #empty-state button {
      padding: 8px 20px;
      background: var(--btn-bg);
      color: #111;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    #empty-state button:hover { background: var(--btn-hover); }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #333;
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 1000;
    }

    #toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Modal */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }

    #modal-overlay.show { display: flex; }

    #modal {
      background: #fff;
      border-radius: 12px;
      padding: 28px;
      width: 320px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }

    #modal h3 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    #modal p {
      font-size: 13px;
      color: #666;
      margin-bottom: 20px;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .modal-btn {
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
    }

    #modal-cancel { background: #f0f0f0; color: #444; }
    #modal-cancel:hover { background: #e8e8e8; }
    #modal-confirm { background: var(--danger); color: #fff; }
    #modal-confirm:hover { background: var(--danger-hover); }

    @media (max-width: 600px) {
      #sidebar { width: 180px; }
      #editor-area { padding: 16px; }
    }
  </style>
</head>
<body>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>📝 메모장</h1>
  </div>
  <button id="new-note-btn">+ 새 메모</button>
  <input id="search-box" type="text" placeholder="검색..." autocomplete="off">
  <div id="note-list"></div>
  <div id="note-count"></div>
</div>

<div id="main">
  <div id="editor-wrapper" style="display:none; flex:1; flex-direction:column; overflow:hidden; display:none;">
    <div id="editor-header">
      <input id="note-title-input" type="text" placeholder="제목 없음" maxlength="100">
      <div class="header-actions">
        <span id="saved-indicator">저장됨</span>
        <button class="header-btn" id="save-btn">저장</button>
        <button class="header-btn" id="delete-btn">삭제</button>
      </div>
    </div>
    <div id="toolbar">
      <button class="toolbar-btn" onclick="execCmd('bold')" title="굵게"><b>B</b></button>
      <button class="toolbar-btn" onclick="execCmd('italic')" title="기울임"><i>I</i></button>
      <button class="toolbar-btn" onclick="execCmd('underline')" title="밑줄"><u>U</u></button>
      <button class="toolbar-btn" onclick="execCmd('strikeThrough')" title="취소선"><s>S</s></button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" onclick="insertHeading()" title="제목">H</button>
      <button class="toolbar-btn" onclick="execCmd('insertUnorderedList')" title="목록">≡</button>
      <button class="toolbar-btn" onclick="execCmd('insertOrderedList')" title="번호 목록">1.</button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" onclick="execCmd('justifyLeft')" title="왼쪽 정렬">◀</button>
      <button class="toolbar-btn" onclick="execCmd('justifyCenter')" title="가운데 정렬">◆</button>
      <button class="toolbar-btn" onclick="execCmd('justifyRight')" title="오른쪽 정렬">▶</button>
      <div class="toolbar-sep"></div>
      <button class="toolbar-btn" onclick="execCmd('undo')" title="실행 취소">↩</button>
      <button class="toolbar-btn" onclick="execCmd('redo')" title="다시 실행">↪</button>
    </div>
    <div id="editor-area">
      <div id="note-content" contenteditable="true" spellcheck="false"></div>
    </div>
    <div id="status-bar">
      <span id="char-count">0자</span>
      <span id="word-count">0단어</span>
      <span id="last-modified"></span>
    </div>
  </div>

  <div id="empty-state">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="1.5">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
      <polyline points="14 2 14 8 20 8"/>
      <line x1="16" y1="13" x2="8" y2="13"/>
      <line x1="16" y1="17" x2="8" y2="17"/>
      <polyline points="10 9 9 9 8 9"/>
    </svg>
    <p>메모를 선택하거나 새 메모를 만드세요</p>
    <button onclick="createNote()">+ 새 메모 만들기</button>
  </div>
</div>

<div id="toast"></div>

<div id="modal-overlay">
  <div id="modal">
    <h3>메모 삭제</h3>
    <p>이 메모를 삭제하시겠습니까? 삭제된 메모는 복구할 수 없습니다.</p>
    <div class="modal-actions">
      <button class="modal-btn" id="modal-cancel">취소</button>
      <button class="modal-btn" id="modal-confirm">삭제</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'web-notepad-notes';
  let notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let activeId = null;
  let saveTimer = null;
  let searchQuery = '';

  const noteList = document.getElementById('note-list');
  const noteCount = document.getElementById('note-count');
  const editorWrapper = document.getElementById('editor-wrapper');
  const emptyState = document.getElementById('empty-state');
  const titleInput = document.getElementById('note-title-input');
  const contentEl = document.getElementById('note-content');
  const savedIndicator = document.getElementById('saved-indicator');
  const charCount = document.getElementById('char-count');
  const wordCount = document.getElementById('word-count');
  const lastModified = document.getElementById('last-modified');

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }

  function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return '방금 전';
    if (diff < 3600000) return Math.floor(diff / 60000) + '분 전';
    if (diff < 86400000) return Math.floor(diff / 3600000) + '시간 전';
    if (diff < 604800000) return Math.floor(diff / 86400000) + '일 전';
    return d.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' });
  }

  function renderList() {
    const q = searchQuery.toLowerCase();
    const filtered = notes.filter(n =>
      n.title.toLowerCase().includes(q) || n.content.toLowerCase().includes(q)
    );
    filtered.sort((a, b) => b.updatedAt - a.updatedAt);

    noteList.innerHTML = '';
    filtered.forEach(n => {
      const item = document.createElement('div');
      item.className = 'note-item' + (n.id === activeId ? ' active' : '');
      item.dataset.id = n.id;

      const plain = n.content.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
      item.innerHTML = `
        <div class="note-item-title">${escapeHtml(n.title) || '제목 없음'}</div>
        <div class="note-item-preview">${escapeHtml(plain.slice(0, 60)) || '내용 없음'}</div>
        <div class="note-item-date">${formatDate(n.updatedAt)}</div>
      `;
      item.addEventListener('click', () => openNote(n.id));
      noteList.appendChild(item);
    });

    noteCount.textContent = `메모 ${filtered.length}개${q ? ' (검색됨)' : ''}`;
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function openNote(id) {
    if (activeId && activeId !== id) saveCurrentNote();
    activeId = id;
    const note = notes.find(n => n.id === id);
    if (!note) return;

    titleInput.value = note.title;
    contentEl.innerHTML = note.content;
    showEditor(true);
    renderList();
    updateStatus();
    savedIndicator.textContent = '저장됨';
    savedIndicator.style.color = '#aaa';
    contentEl.focus();
  }

  function showEditor(show) {
    editorWrapper.style.display = show ? 'flex' : 'none';
    editorWrapper.style.flexDirection = 'column';
    editorWrapper.style.overflow = 'hidden';
    editorWrapper.style.flex = '1';
    emptyState.style.display = show ? 'none' : 'flex';
  }

  function createNote() {
    if (activeId) saveCurrentNote();
    const note = {
      id: generateId(),
      title: '',
      content: '',
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    notes.unshift(note);
    save();
    openNote(note.id);
    titleInput.focus();
    titleInput.select();
  }

  function saveCurrentNote() {
    if (!activeId) return;
    const note = notes.find(n => n.id === activeId);
    if (!note) return;
    note.title = titleInput.value.trim();
    note.content = contentEl.innerHTML;
    note.updatedAt = Date.now();
    save();
    renderList();
    savedIndicator.textContent = '저장됨';
    savedIndicator.style.color = '#aaa';
  }

  function scheduleSave() {
    savedIndicator.textContent = '저장 중...';
    savedIndicator.style.color = '#f0c040';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveCurrentNote, 800);
  }

  function updateStatus() {
    const plain = contentEl.innerText || '';
    const chars = plain.length;
    const words = plain.trim() ? plain.trim().split(/\s+/).length : 0;
    charCount.textContent = chars + '자';
    wordCount.textContent = words + '단어';
    const note = notes.find(n => n.id === activeId);
    if (note) lastModified.textContent = '수정: ' + new Date(note.updatedAt).toLocaleString('ko-KR');
  }

  function deleteCurrentNote() {
    if (!activeId) return;
    document.getElementById('modal-overlay').classList.add('show');
  }

  function execCmd(cmd) {
    document.execCommand(cmd, false, null);
    contentEl.focus();
    scheduleSave();
  }

  function insertHeading() {
    document.execCommand('formatBlock', false, 'h3');
    contentEl.focus();
    scheduleSave();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }

  // Events
  document.getElementById('new-note-btn').addEventListener('click', createNote);

  document.getElementById('save-btn').addEventListener('click', () => {
    saveCurrentNote();
    showToast('저장되었습니다');
  });

  document.getElementById('delete-btn').addEventListener('click', deleteCurrentNote);

  document.getElementById('modal-cancel').addEventListener('click', () => {
    document.getElementById('modal-overlay').classList.remove('show');
  });

  document.getElementById('modal-confirm').addEventListener('click', () => {
    document.getElementById('modal-overlay').classList.remove('show');
    notes = notes.filter(n => n.id !== activeId);
    activeId = null;
    save();
    showEditor(false);
    renderList();
    showToast('삭제되었습니다');
  });

  titleInput.addEventListener('input', scheduleSave);
  contentEl.addEventListener('input', () => {
    scheduleSave();
    updateStatus();
  });

  document.getElementById('search-box').addEventListener('input', e => {
    searchQuery = e.target.value;
    renderList();
  });

  // Ctrl+S
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveCurrentNote();
      showToast('저장되었습니다');
    }
  });

  // Init
  showEditor(false);
  renderList();
  if (notes.length > 0) {
    openNote(notes.sort((a, b) => b.updatedAt - a.updatedAt)[0].id);
  }
</script>
</body>
</html>
